version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME:-mqtt_user}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - tuya-network
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$MQTT_PASSWORD" ]; then
          echo 'WARNING: MQTT_PASSWORD not set. Using default password. Set MQTT_PASSWORD environment variable for production.'
          MQTT_PASSWORD=default_mqtt_password_$$(openssl rand -hex 8)
        fi
        mosquitto_passwd -c -b /mosquitto/config/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        chmod 644 /mosquitto/config/passwd
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf

  tuya-mqtt:
    image: thecodemonkey/tuya-mqtt:latest
    container_name: tuya-mqtt
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:-mqtt_user}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
    volumes:
      - ./tuya-mqtt/devices.conf:/app/devices.conf:ro
    networks:
      - tuya-network
    restart: unless-stopped

networks:
  tuya-network:
    driver: bridge
