spring.application.name=app

spring.datasource.url=jdbc:mysql://localhost:3306/sistema-esp8266
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:LugaLoft}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.profiles.active=dev
# Database migration: use 'none' to prevent Hibernate from validating/modifying schema
# Flyway will handle all schema changes
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:none}
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-on-validation-error=false
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-post-size=10MB
server.port=8080

spring.jpa.show-sql=false

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# CORS Configuration
# Set CORS_ALLOWED_ORIGINS environment variable for production (comma-separated list)
# Example: CORS_ALLOWED_ORIGINS=http://localhost:3000,https://yourdomain.com
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# MQTT Configuration
# Set MQTT_USERNAME and MQTT_PASSWORD environment variables for authentication
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.client.id=SpringAppClient
mqtt.topic.command=/iot/sensores/ac/comando

# JWT Configuration
# IMPORTANT: JWT_SECRET environment variable is REQUIRED and must be at least 32 characters long
# The application will fail to start if JWT_SECRET is not set or is too short
# Generate a secure secret: openssl rand -base64 32
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000