spring.application.name=app

spring.datasource.url=jdbc:mysql://localhost:3306/sistema-esp8266
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:LugaLoft}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.profiles.active=dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.servlet.multipart.enabled=true
server.port=8080

spring.jpa.show-sql=false

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# MQTT (Apontando para seu Node-RED/Aedes)
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=SpringAppClient
mqtt.topic.command=/iot/sensores/ac/comando

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-minimum-32-characters}
jwt.expiration=86400000