# Production profile configuration
# This file should be used when SPRING_PROFILES_ACTIVE=prod

# Database - use validate to prevent automatic schema changes
spring.jpa.hibernate.ddl-auto=validate

# Flyway - enabled for production migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Security - require environment variables
# JWT_SECRET, ADMIN_USERNAME, ADMIN_PASSWORD must be set
# MQTT_USERNAME, MQTT_PASSWORD must be set
# CORS_ALLOWED_ORIGINS must be set

# Logging
logging.level.root=INFO
logging.level.com.iot.app=INFO
